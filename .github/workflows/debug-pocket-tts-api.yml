name: Debug Pocket-TTS API

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  debug-pocket-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Pocket-TTS
        run: |
          pip3 install pocket-tts 2>&1 | tail -5

      - name: Inspect Pocket-TTS module
        run: |
          python3 debug_inspect_pocket_tts.py 2>&1 | tee pocket-tts-api.txt

      - name: Test Pocket-TTS generation methods
        run: |
          python3 debug_test_pocket_tts.py 2>&1 | tee pocket-tts-api-test.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-tts-debug
          path: |
            pocket-tts-api.txt
            pocket-tts-api-test.txt