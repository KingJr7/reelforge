name: Debug Pocket-TTS API

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  debug-pocket-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Pocket-TTS
        run: |
          pip3 install pocket-tts 2>&1 | tail -5

      - name: Inspect Pocket-TTS module
        run: |
          cat > /tmp/inspect_pocket_tts.py << 'PYEOF'
import pocket_tts
print('Pocket-TTS version:', pocket_tts.__version__ if hasattr(pocket_tts, '__version__') else 'unknown')
print('All attributes:', [x for x in dir(pocket_tts) if not x.startswith('_')])
import inspect
for name in dir(pocket_tts):
    if not name.startswith('_'):
        obj = getattr(pocket_tts, name)
        if callable(obj):
            try:
                sig = inspect.signature(obj)
                print('  {}{}'.format(name, sig))
            except:
                print('  {}: callable'.format(name))
        else:
            print('  {}: {}'.format(name, type(obj)))
PYEOF
          python3 /tmp/inspect_pocket_tts.py 2>&1 | tee pocket-tts-api.txt

      - name: Test Pocket-TTS generation methods
        run: |
          cat > /tmp/test_pocket_tts.py << 'PYEOF'
import pocket_tts
import subprocess

text = 'Bonjour, ceci est un test.'

# Method 1: TTS class with to_file
try:
    from pocket_tts import TTS
    tts = pocket_tts.TTS()
    tts.to_file('Bonjour, ceci est un test.', '/tmp/test1.wav')
    print('Method 1 (TTS().to_file) succeeded')
except Exception as e:
    print('Method 1 failed: {}'.format(e))

# Method 2: generate function
try:
    from pocket_tts import generate
    generate('Bonjour, ceci est un test.', '/tmp/test2.wav')
    print('Method 2 (generate) succeeded')
except Exception as e:
    print('Method 2 failed: {}'.format(e))

# Method 3: CLI
try:
    result = subprocess.run(['pocket-tts', '--text', 'Bonjour', '--output', '/tmp/test3.wav'], capture_output=True, text=True, timeout=60)
    if result.returncode == 0:
        print('Method 3 (CLI) succeeded')
    else:
        print('Method 3 failed: {}'.format(result.stderr))
except Exception as e:
    print('Method 3 failed: {}'.format(e))

# Method 4: CLI help
try:
    result = subprocess.run(['pocket-tts', '--help'], capture_output=True, text=True, timeout=10)
    stdout = result.stdout[:500] if result.stdout else 'No stdout'
    stderr = result.stderr[:500] if result.stderr else 'None'
    print('CLI help: {}'.format(stdout))
    print('CLI stderr: {}'.format(stderr))
except Exception as e:
    print('Method 4 failed: {}'.format(e))
PYEOF
          python3 /tmp/test_pocket_tts.py 2>&1 | tee pocket-tts-api-test.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-tts-debug
          path: |
            pocket-tts-api.txt
            pocket-tts-api-test.txt