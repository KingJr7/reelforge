name: Test Pocket-TTS + Moteur Classique

on:
  push:
    branches: [main]

jobs:
  test-pocket-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip3 install numpy scipy requests pillow assemblyai python-dotenv pytest
          pip3 install playwright
          python3 -m playwright install chromium 2>/dev/null || echo "Playwright chromium install skipped"

      - name: Install Pocket-TTS
        run: |
          echo "=== Installing Pocket-TTS ==="
          pip3 install pocket-tts 2>&1 | tail -10
          python3 -c "import pocket_tts; print('Pocket-TTS import OK')" 2>&1 || echo "Pocket-TTS import FAILED"
          pip3 list | grep -i pocket || echo "No pocket package found"

      - name: Setup assets directory
        run: |
          echo "=== Setting up assets ==="
          mkdir -p assets
          cp -r motion-test/img/* assets/ 2>/dev/null || echo "Warning: motion-test/img not found"
          ls -la assets/

      - name: Debug - Check script and files
        run: |
          echo "=== Checking script and files ==="
          ls -la scripts/
          cat scripts/test_pocket_tts.txt
          ls -la assets/
          echo "=== Starting voice generation test ==="

      - name: Test Pocket-TTS voice generation
        run: |
          python3 debug_generate_voice.py 2>&1 | tee pocket-tts-render.log
          echo "Generation exit code: $?"
          echo "=== pocket-tts-render.log content ==="
          cat pocket-tts-render.log
        env:
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-pocket-tts-artifacts
          path: |
            pocket-tts-render.log
            voice_cache/
            out/