name: Test Pocket-TTS + Moteur Classique

on:
  push:
    branches: [main]

jobs:
  test-pocket-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip3 install numpy scipy requests pillow assemblyai python-dotenv pytest

      - name: Install Pocket-TTS
        run: |
          echo "=== Attempt 1: pip install pocket-tts ==="
          pip3 install pocket-tts 2>&1 | tail -20 || echo "pip install failed"
          echo "=== Attempt 2: pip install from GitHub ==="
          pip3 install git+https://github.com/kyutai-labs/pocket-tts.git 2>&1 | tail -20 || true
          echo "=== Check import ==="
          python3 -c "import pocket_tts; print('Pocket-TTS import OK'); print('Dir:', [x for x in dir(pocket_tts) if not x.startswith('_')])" 2>&1 || echo "Pocket-TTS import FAILED"

      - name: Check installed packages
        run: |
          pip3 list | grep -i pocket || echo "No pocket package found"

      - name: Generate voice + Render video
        run: |
          python3 make_reel.py \
            --script scripts/test_pocket_tts.txt \
            --tts pocket-tts \
            --assemblyai \
            --out out/test_pocket_tts.mp4 \
            --glitch-frames 4 2>&1 | tee pocket-tts-render.log || echo "WARNING: Generation failed" | tee -a pocket-tts-render.log
        env:
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}

      - name: Verify output
        run: |
          if [ -f out/test_pocket_tts.mp4 ]; then
            python3 -c "
import subprocess, json
out = subprocess.run(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width,height,r_frame_rate,codec_name,duration','-of','json','out/test_pocket_tts.mp4'],capture_output=True,text=True)
s = json.loads(out.stdout)['streams'][0]
print(f'Video: {s[\"width\"]}x{s[\"height\"]} {s[\"r_frame_rate\"]} {s[\"codec_name\"]} {s[\"duration\"]}s')
out2 = subprocess.run(['ffprobe','-v','error','-select_streams','a:0','-show_entries','stream=codec_name,duration','-of','json','out/test_pocket_tts.mp4'],capture_output=True,text=True)
a = json.loads(out2.stdout)['streams'][0]
print(f'Audio: {a[\"codec_name\"]} {a[\"duration\"]}s')
print(f'Duration match: {abs(float(s[\"duration\"]) - float(a[\"duration\"])) < 0.1}')
            "
          else
            echo "Video file not found"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-pocket-tts-artifacts
          path: |
            out/test_pocket_tts.mp4
            pocket-tts-render.log
            pocket-tts-install.log