name: Render Motion Kit Video

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.52.0-focal
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          apt-get update && apt-get install -y ffmpeg

      - name: Build video.json
        run: |
          node motion-kit/scripts/build.mjs motion-test/script.json motion-test/words.json motion-test/video.json

      - name: Render MP4
        run: |
          node motion-kit/render.mjs motion-test/video.json out/levelcash_v1_motion.mp4 --scale 1.875

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: levelcash-v1-motion
          path: out/levelcash_v1_motion.mp4
