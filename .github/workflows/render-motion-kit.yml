name: Render Motion Kit Video

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Playwright + Chromium
        run: |
          npm i playwright
          npx playwright install chromium

      - name: Verify installation
        run: |
          node -e "const pw = require('playwright'); console.log('Playwright OK:', pw.chromium.name)"
          ffmpeg -version | head -1

      - name: Build video.json
        run: |
          node motion-kit/scripts/build.mjs motion-test/script.json motion-test/words.json motion-test/video.json

      - name: Render MP4
        run: |
          node motion-kit/render.mjs motion-test/video.json out/levelcash_v1_motion.mp4 --scale 1.875

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: levelcash-v1-motion
          path: out/levelcash_v1_motion.mp4
