name: Render Motion Kit Video

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm i playwright && npx playwright install chromium

      - name: Build video.json (script + words -> timeline)
        run: |
          node motion-kit/scripts/build.mjs motion-test/script.json motion-test/words.json motion-test/video.json

      - name: Render MP4 (HTML -> frames -> FFmpeg)
        run: |
          node motion-kit/render.mjs motion-test/video.json out/levelcash_v1_motion.mp4 --scale 1.875

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: levelcash-v1-motion
          path: out/levelcash_v1_motion.mp4
