name: Render Remotion Bonne Piste

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Remotion dependencies
        run: |
          cd remotion-bonne-piste
          npm install

      - name: Verify installation
        run: |
          cd remotion-bonne-piste
          ls node_modules/.bin/remotion && node -e "require('react'); console.log('React OK')"

      - name: Build video.json
        run: |
          cd remotion-bonne-piste
          node src/build.mjs script.json words.json video.json

      - name: Render MP4 with Remotion
        run: |
          cd remotion-bonne-piste
          node src/render.mjs video.json out/bonne-piste.mp4 --scale 1.875

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: bonne-piste-video
          path: remotion-bonne-piste/out/*.mp4
