name: Generate Levelcash Videos

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip python3-dev

      - name: Install Python dependencies
        run: |
          pip3 install numpy scipy requests pillow assemblyai python-dotenv pytest playwright
          playwright install chromium

      - name: Run automated tests
        run: |
          PYTHONPATH=. pytest -q
          python3 -m py_compile *.py
          git diff --check

      - name: Run video generation (v1)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
        run: |
          python3 make_reel.py \
            --script scripts/levelcash_v1_humain.txt \
            --voice-file v1.mp3 \
            --assemblyai \
            --bgm ssstik.io_1782406846547.mp3 \
            --out out/levelcash_v1.mp4 \
            --glitch-frames 4

      - name: Run video generation (v2)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
        run: |
          python3 make_reel.py \
            --script scripts/levelcash_v2_humain.txt \
            --voice-file v2.mp3 \
            --assemblyai \
            --bgm ssstik.io_1782406846547.mp3 \
            --out out/levelcash_v2.mp4 \
            --glitch-frames 4

      - name: Run video generation (v3)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
        run: |
          python3 make_reel.py \
            --script scripts/levelcash_v3_humain.txt \
            --voice-file v3.mp3 \
            --assemblyai \
            --bgm ssstik.io_1782406846547.mp3 \
            --out out/levelcash_v3.mp4 \
            --glitch-frames 4

      - name: Run video generation (v4)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
        run: |
          python3 make_reel.py \
            --script scripts/levelcash_v4_humain.txt \
            --voice-file v4.mp3 \
            --assemblyai \
            --bgm ssstik.io_1782406846547.mp3 \
            --out out/levelcash_v4.mp4 \
            --glitch-frames 4

      - name: Run video generation (v5)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
        run: |
          python3 make_reel.py \
            --script scripts/levelcash_v5_humain.txt \
            --voice-file v5.mp3 \
            --assemblyai \
            --bgm ssstik.io_1782406846547.mp3 \
            --out out/levelcash_v5.mp4 \
            --glitch-frames 4

      - name: Run video generation (v6)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
        run: |
          python3 make_reel.py \
            --script scripts/levelcash_v6_tu_savais_que.txt \
            --voice-file v6.mp3 \
            --assemblyai \
            --bgm ssstik.io_1782406846547.mp3 \
            --out out/levelcash_v6.mp4 \
            --glitch-frames 4

      - name: Run video generation (v7)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
        run: |
          python3 make_reel.py \
            --script scripts/levelcash_v7_jai_decouvert.txt \
            --voice-file v7.mp3 \
            --assemblyai \
            --bgm ssstik.io_1782406846547.mp3 \
            --out out/levelcash_v7.mp4 \
            --glitch-frames 4

      - name: Run video generation (v8 delestage)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
        run: |
          python3 make_reel.py \
            --script scripts/levelcash_delestage.txt \
            --voice-file v8.mp3 \
            --assemblyai \
            --bgm ssstik.io_1782406846547.mp3 \
            --out out/levelcash_delestage.mp4 \
            --glitch-frames 4

      - name: Install Pocket-TTS (Kyutai Labs)
        run: |
          pip3 install pocket-tts || echo "WARNING: pocket-tts install failed"

      - name: Test Pocket-TTS voice generation
        run: |
          python3 make_reel.py \
            --script scripts/test_pocket_tts.txt \
            --tts pocket-tts \
            --assemblyai \
            --out out/test_pocket_tts.mp4 \
            --glitch-frames 4
        env:
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}

      - name: Verify Pocket-TTS output
        run: |
          python3 -c "
import subprocess, json
out = subprocess.run(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width,height,r_frame_rate,codec_name,duration','-of','json','out/test_pocket_tts.mp4'],capture_output=True,text=True)
s = json.loads(out.stdout)['streams'][0]
print(f'Video: {s[\"width\"]}x{s[\"height\"]} {s[\"r_frame_rate\"]} {s[\"codec_name\"]} {s[\"duration\"]}s')
out2 = subprocess.run(['ffprobe','-v','error','-select_streams','a:0','-show_entries','stream=codec_name,duration','-of','json','out/test_pocket_tts.mp4'],capture_output=True,text=True)
a = json.loads(out2.stdout)['streams'][0]
print(f'Audio: {a[\"codec_name\"]} {a[\"duration\"]}s')
print(f'Duration match: {abs(float(s[\"duration\"]) - float(a[\"duration\"])) < 0.1}')
          "

      - name: Upload all video artifacts
        uses: actions/upload-artifact@v4
        with:
          name: levelcash-videos
          path: out/*.mp4
