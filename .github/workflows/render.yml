name: Generate Levelcash Videos

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip python3-dev

      - name: Install Python dependencies
        run: |
          pip3 install numpy scipy requests pillow assemblyai python-dotenv pytest playwright
          playwright install chromium

      - name: Run automated tests
        run: |
          PYTHONPATH=. pytest -q
          python3 -m py_compile *.py
          git diff --check

      - name: Run video generation (v1)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
        run: |
          python3 make_reel.py \
            --script scripts/levelcash_v1_humain.txt \
            --voice-file v1.mp3 \
            --assemblyai \
            --bgm ssstik.io_1782406846547.mp3 \
            --out out/levelcash_v1.mp4 \
            --glitch-frames 4

      - name: Run video generation (v2)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
